name: Build Release Assets (iOS & Android)

# Tag push only: a release event too would build twice with two numbers.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- JOB 0: VERSION GUARD ---
  # pubspec is the single version source for every store. Fails before the
  # builds when the tag and pubspec disagree or the build number did not rise.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pubspec version
        run: |
          read_version() { grep -E '^version:' | head -1 | sed -E 's/^version:[[:space:]]*//'; }
          CURRENT="$(read_version < pubspec.yaml)"
          NAME="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"
          echo "pubspec: $NAME build $BUILD"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Not a tag build; skipping tag checks."
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" != "v$NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $NAME."
            exit 1
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous tag; nothing to compare."
            exit 0
          fi
          PREV="$(git show "$PREV_TAG:pubspec.yaml" | read_version)"
          PREV_BUILD="${PREV##*+}"
          echo "previous: $PREV_TAG build $PREV_BUILD"
          if (( BUILD <= PREV_BUILD )); then
            echo "::error::Build number $BUILD must be higher than $PREV_BUILD from $PREV_TAG. Bump the +N in pubspec.yaml."
            exit 1
          fi

  # --- JOB 0b: TESTS ---
  # Runs beside the builds; only the publish jobs wait on it, so a failing
  # test blocks every store without adding its time to the release.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # --- JOB 1: ANDROID BUILD ---
  build-android:
    needs: check-version
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Temurin 17 ships on the runner, so this skips the JDK download.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/ermchat-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../ermchat-release.jks
          EOF

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Prepare APK Assets
        run: |
          mkdir -p build/release-assets
          TAG_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "build/release-assets/${REPO_NAME}-${TAG_NAME}-${abi}.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/${REPO_NAME}-${TAG_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-asset
          path: build/release-assets/*.apk

      - name: Upload app bundle artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: build/app/outputs/bundle/release/app-release.aab

  # --- JOB 1b: GOOGLE PLAY ---
  play:
    needs: [build-android, test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Download app bundle
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.KEYSTORE_BASE64 != ''
        uses: actions/download-artifact@v4
        with:
          name: android-bundle

      - name: Publish to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.bananguh.ErmChat
          releaseFiles: app-release.aab
          track: production
          status: completed

  # --- JOB 2: IOS BUILD ---
  build-ios:
    needs: check-version
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Install dependencies
        run: flutter pub get

      # All three secrets required; otherwise fall back to an unsigned build.
      - name: Set up iOS code signing
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.BUILD_PROVISION_PROFILE_BASE64 != '' && env.P12_PASSWORD != ''
        run: |
          echo ""
          echo "======================================================"
          echo "===== SIGNED IOS BUILD — SIGNING SECRETS FOUND ======="
          echo "======================================================"
          echo ""

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PP_PATH="$RUNNER_TEMP/build.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null \
            || { echo "::error::BUILD_CERTIFICATE_BASE64 is not valid Base64."; exit 1; }

          CERT_BYTES="$(wc -c < "$CERT_PATH" | tr -d ' ')"
          CERT_HEAD="$(LC_ALL=C head -c 16 "$CERT_PATH" | od -An -tx1 | tr -d ' \n')"
          CERT_TAIL="$(LC_ALL=C tail -c 16 "$CERT_PATH" | od -An -tx1 | tr -d ' \n')"
          echo "::notice::decoded certificate: ${CERT_BYTES} bytes, head=${CERT_HEAD}, tail=${CERT_TAIL}"
          echo "::notice::compare locally: wc -c certificate.p12 must equal ${CERT_BYTES}"

          # Fail fast with actionable messages instead of a bare
          # "SecKeychainItemImport: Unable to decode the provided data."
          if ! openssl asn1parse -inform DER -in "$CERT_PATH" > /dev/null 2>&1; then
            echo "::error::Decoded file (${CERT_BYTES} bytes) is incomplete DER — the Base64 in"
            echo "::error::BUILD_CERTIFICATE_BASE64 was almost certainly TRUNCATED while pasting."
            echo "::error::Fix: base64 -i certificate.p12 | pbcopy, then paste the WHOLE output into the secret."
            exit 1
          fi

          if ! openssl pkcs12 -in "$CERT_PATH" -passin "pass:$P12_PASSWORD" -nocerts -nokeys < /dev/null > /dev/null 2>&1; then
            echo "::error::.p12 is structurally valid but will not open: P12_PASSWORD does not match the"
            echo "::error::password used when exporting, or the export needs re-doing from Keychain Access."
            exit 1
          fi

          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH" 2>/dev/null \
            || { echo "::error::BUILD_PROVISION_PROFILE_BASE64 is not valid Base64."; exit 1; }
          echo "::notice::decoded profile: $(wc -c < "$PP_PATH" | tr -d ' ') bytes"
          if ! security cms -D -i "$PP_PATH" > /dev/null 2>&1; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 did not decode to a valid .mobileprovision profile."
            exit 1
          fi

          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -o - -)
          TEAM_ID=$(security cms -D -i "$PP_PATH" | plutil -extract TeamIdentifier.0 raw -o - -)
          APP_ID=$(security cms -D -i "$PP_PATH" | plutil -extract Entitlements.application-identifier raw -o - -)
          BUNDLE_ID="${APP_ID#"$TEAM_ID."}"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles/$UUID.mobileprovision"

          cat >> ios/Flutter/Release.xcconfig <<EOF

          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_STYLE = Manual
          PROVISIONING_PROFILE_SPECIFIER = $UUID
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "Signing ready: team=$TEAM_ID profile=$UUID bundle=$BUNDLE_ID"

      - name: Build signed iOS IPA
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.BUILD_PROVISION_PROFILE_BASE64 != '' && env.P12_PASSWORD != ''
        run: |
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Prepare signed IPA asset
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.BUILD_PROVISION_PROFILE_BASE64 != '' && env.P12_PASSWORD != ''
        run: |
          mkdir -p build/release-assets
          TAG_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          cp build/ios/ipa/*.ipa "build/release-assets/${REPO_NAME}-${TAG_NAME}.ipa"

      - name: Build unsigned iOS IPA
        if: env.BUILD_CERTIFICATE_BASE64 == '' || env.BUILD_PROVISION_PROFILE_BASE64 == '' || env.P12_PASSWORD == ''
        run: |
          TAG_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          echo ""
          echo "=========================================================="
          echo "=========================================================="
          echo "                                                          "
          echo "   █████  ██    ██ ████████ ██     ██                     "
          echo "  ██   ██ ██    ██    ██    ██     ██                     "
          echo "  ███████ ██    ██    ██    ██  █  ██                     "
          echo "  ██   ██  ██  ██     ██    ██ ███ ██                     "
          echo "  ██   ██   ████      ██     ███ ███                      "
          echo "                                                          "
          echo "   UNSIGNED IOS BUILD — SIGNING SECRETS MISSING           "
          echo "   (needs BUILD_CERTIFICATE_BASE64 +                      "
          echo "        BUILD_PROVISION_PROFILE_BASE64 + P12_PASSWORD)    "
          echo "   THE IPA WILL NOT RUN ON DEVICES WITHOUT RE-SIGNING!    "
          echo "                                                          "
          echo "=========================================================="
          echo "=========================================================="
          echo ""
          flutter build ipa --no-codesign
          echo ""
          echo "=========================================================="
          echo "  ⚠️  OUTPUT: ${REPO_NAME}-${TAG_NAME}-UNSIGNED.ipa (UNSIGNED!) ⚠️ "
          echo "=========================================================="
          echo ""

      - name: Package payload into downloadable .ipa
        if: env.BUILD_CERTIFICATE_BASE64 == '' || env.BUILD_PROVISION_PROFILE_BASE64 == '' || env.P12_PASSWORD == ''
        run: |
          mkdir -p build/release-assets
          TAG_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/build/release-assets/${REPO_NAME}-${TAG_NAME}-UNSIGNED.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-asset
          path: build/release-assets/*.ipa

  # --- JOB 2b: TESTFLIGHT ---
  # Own job so the GitHub Release never waits on Apple's processing. With
  # the TESTFLIGHT_EXTERNAL_GROUP repo variable set, it waits for processing,
  # adds the build to that group and submits it for beta review.
  testflight:
    needs: [build-ios, test]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
    steps:
      - name: Checkout repository
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_PRIVATE_KEY != ''
        uses: actions/checkout@v4

      - name: Download IPA
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_PRIVATE_KEY != ''
        uses: actions/download-artifact@v4
        with:
          name: ios-asset
          path: build/release-assets

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_PRIVATE_KEY != ''
        run: |
          IPA="$(ls build/release-assets/*.ipa | grep -v UNSIGNED | head -1 || true)"
          if [[ -z "$IPA" ]]; then
            echo "::notice::No signed IPA; skipping TestFlight."
            exit 0
          fi
          BUILD="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/.*\+//')"
          KEY_JSON="$RUNNER_TEMP/asc_api_key.json"
          python3 -c 'import json, os; print(json.dumps({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": os.environ["ASC_PRIVATE_KEY"], "in_house": False}))' > "$KEY_JSON"
          command -v fastlane > /dev/null || gem install fastlane --no-document
          ARGS=(--ipa "$IPA" --api_key_path "$KEY_JSON" --changelog "Build $BUILD")
          if [[ -n "$EXTERNAL_GROUP" ]]; then
            ARGS+=(--distribute_external true --groups "$EXTERNAL_GROUP")
          else
            ARGS+=(--skip_waiting_for_build_processing true)
          fi
          fastlane pilot upload "${ARGS[@]}"

  # --- JOB 3: PUBLISH TO GITHUB RELEASE ---
  publish-release:
    needs: [build-android, build-ios, test]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      # The APK and IPA assets only; the app bundle is for Play.
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: '*-asset'
          path: build/release-assets
          merge-multiple: true

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release-assets/*