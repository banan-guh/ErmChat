name: Bug Report
description: Report something broken or misbehaving
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster it can get fixed.
        If this was forwarded to you by someone else, please try to get the original details, vague reports are hard to work with.

  - type: input
    id: version
    attributes:
      label: App version
      description: Found in Settings, or via your phone's App Info screen for the installed APK/IPA
      placeholder: "e.g. v0.2.2"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS version
      description: e.g. "Pixel 8, Android 15" or "iPhone 14, iOS 18.2"
      placeholder: ""
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug as specifically as you can.
      placeholder: "When I do X, Y happens instead of Z"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, if possible
      placeholder: |
        1. Open the app
        2. Join a channel
        3. ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / crash output
      description: Attach any screenshots or error messages here.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I'm running the latest release, not an older version
          required: false
        - label: I checked existing issues and this hasn't already been reported
          required: false